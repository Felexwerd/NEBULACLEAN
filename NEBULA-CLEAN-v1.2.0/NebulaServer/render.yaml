services:
  - type: web
    name: nebula-clean-api
    runtime: docker
    dockerfilePath: ./NebulaServer/Dockerfile
    dockerContext: ./NebulaServer
    healthCheckPath: /health
    envVars:
      - key: NEBULA_ADMIN_EMAIL
        sync: false
      - key: NEBULA_ADMIN_PASSWORD
        sync: false
      - key: NEBULA_DB_PATH
        value: /app/nebula.db
